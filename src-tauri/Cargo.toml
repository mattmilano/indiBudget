[package]
name = "indibudget"
version = "1.0.0"
description = "Personal budget application with calendar-focused expense tracking"
authors = ["Matt Milano"]
license = "MIT"
repository = "https://github.com/mattmilano/indiBudget"
edition = "2021"

[lib]
name = "indibudget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
csv = "1.3"
calamine = "0.24"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
thiserror = "1.0"
rust_decimal = { version = "1.35", features = ["serde"] }
directories = "5.0"
dirs = "5.0"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
regex = "1.10"
base64 = "0.22"
